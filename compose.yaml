name: report-service
services:
  app:
    image: report-service:${APP_VERSION:-1.0.1}
    build: .
    environment:
      PORT: ${PORT:-8207}
      DATA_DIR: /data
    ports:
      - "${HOST_PORT:-8207}:${PORT:-8207}"
    volumes:
      - report-data:/data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  report-data:
